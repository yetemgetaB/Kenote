name: "Release Kenote"

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  release:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: "windows-latest"
            args: ""
          - platform: "macos-latest"
            args: ""
          - platform: "ubuntu-22.04"
            args: ""

    runs-on: ${{ matrix.platform }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "pnpm"

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Install Linux system dependencies (Ubuntu only)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libssl-dev rpm

      - name: Install frontend dependencies
        run: pnpm install

      - name: Extract release notes from CHANGELOG
        run: |
          node -e '
            const fs = require("fs");
            const { version } = JSON.parse(fs.readFileSync("package.json", "utf8"));
            const changelog = fs.readFileSync("CHANGELOG.md", "utf8");
            const escaped = version.replace(/[.*+?^${}()|[\]\\]/g, "\\$&");
            const re = new RegExp(`(?:^|\\r?\\n)## \\[${escaped}\\][^\\r\\n]*\\r?\\n([\\s\\S]*?)(?=\\r?\\n## \\[|$)`);
            const match = changelog.match(re);
            const notes = match ? match[1].trim() : `Release v${version}`;
            const body = [
              `## KeNote v${version}`,
              "",
              notes,
              "",
              "### Download & Install",
              "- **Windows**: Download the `.msi` or `-setup.exe` installer below.",
              "- **macOS**: Download the `.dmg` installer.",
              "- **Linux**: Download the `.rpm`, `.deb`, or `.AppImage` package."
            ].join("\n");
            fs.writeFileSync("release-notes.md", body);
          '

      - name: Build and Release Tauri App
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        with:
          tagName: v__VERSION__
          releaseName: "Kenote v__VERSION__"
          releaseBodyPath: release-notes.md
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}
